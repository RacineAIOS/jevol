[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jevol"
version = "0.1.0"
description = "Jevol: a drone flown by a small vision-language model, with MLX and CUDA inference servers"
readme = "README.md"
license-files = ["LICENSE.md", "NOTICE", "LICENSES/*"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pillow>=11.0",
    "tokenizers>=0.22",
]

[project.optional-dependencies]
mlx = [
    "mlx==0.32.4",
    "mlx-lm==0.32.2",
]
cuda = [
    "torch>=2.4",
    "safetensors>=0.4",
]
fla = [
    "flash-linear-attention>=0.3",
]
server = [
    "aiohttp>=3.10",
]
test = [
    "pytest>=8",
]

[project.scripts]
jevol = "jevol.cli:main"

[tool.setuptools]
packages = ["jevol", "jevol.backends"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu132", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
